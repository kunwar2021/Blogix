openapi: 3.0.3
info:
  title: Blogix REST API
  version: 1.0.0
  description: Comprehensive RESTful API for Blogix management system including posts,
    categories, comments, and user management.
paths:
  /api/blogs/:
    get:
      operationId: blogs_list
      summary: List all blog posts with pagination
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Blogs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlogList'
          description: ''
    post:
      operationId: blogs_create
      summary: Create a new blog post
      tags:
      - Blogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
          description: ''
  /api/blogs/{id}/:
    get:
      operationId: blogs_retrieve
      summary: Retrieve blog post details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blogs.
        required: true
      tags:
      - Blogs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
          description: ''
    put:
      operationId: blogs_update
      summary: Update a blog post
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blogs.
        required: true
      tags:
      - Blogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
          description: ''
    patch:
      operationId: blogs_partial_update
      summary: Partially update a blog post
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blogs.
        required: true
      tags:
      - Blogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBlogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBlogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBlogRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
          description: ''
    delete:
      operationId: blogs_destroy
      summary: Delete a blog post
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blogs.
        required: true
      tags:
      - Blogs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
