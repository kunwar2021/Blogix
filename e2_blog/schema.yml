              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      summary: Update a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
