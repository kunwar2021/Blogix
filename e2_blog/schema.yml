        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Blog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        category:
          type: integer
        category_detail:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        author:
          type: integer
        author_detail:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        blog_image:
          type: string
          format: uri
        short_description:
          type: string
          maxLength: 1000
        blog_body:
          type: string
          maxLength: 3000
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_feacherd:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - author_detail
      - blog_body
      - blog_image
      - category
      - category_detail
      - created_at
      - id
      - short_description
      - title
      - updated_at
    BlogPost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
      required:
      - content
      - id
      - title
    BlogRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        category:
          type: integer
        author:
          type: integer
        blog_image:
          type: string
          format: binary
        short_description:
          type: string
          minLength: 1
          maxLength: 1000
        blog_body:
          type: string
          minLength: 1
          maxLength: 3000
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_feacherd:
          type: boolean
      required:
      - author
      - blog_body
      - blog_image
      - category
      - short_description
      - title
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category_name:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - created_at
      - id
      - updated_at
    CategoryRequest:
      type: object
      properties:
        category_name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - category_name
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_detail:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        blog:
          type: integer
        blog_detail:
          allOf:
          - $ref: '#/components/schemas/Blog'
          readOnly: true
        comment:
          type: string
          maxLength: 250
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blog
      - blog_detail
      - comment
      - created_at
      - id
      - updated_at
      - user
      - user_detail
    CommentRequest:
      type: object
      properties:
        user:
          type: integer
        blog:
          type: integer
        comment:
          type: string
          minLength: 1
          maxLength: 250
      required:
      - blog
      - comment
      - user
    PaginatedBlogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Blog'
    PaginatedBlogPostList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/BlogPost'
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedBlogRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 50
